# Seed profile for B2C garment/cloth shops. Note lots and dispatch are off;
# catalog and walk-in customers are on.
segments: [retail]
modules:
  lots: false
  dispatch: false
  job_work: false
  catalog: true
  credit_ledger: false   # most retail is cash/UPI; flip on if udhaar appears
vocabulary:
  quantity_units: [piece, meter, set]
  rate_basis: per_piece
  quality_code_example: "KRT-BLU-M"
  party_terms: [customer, grahak]
rules:
  overdue_days: 15
  rate_deviation_pct: 25
  low_stock_threshold: 5
